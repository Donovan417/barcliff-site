name: Deploy to Vercel
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip pushes authored by the repo owner - those already deploy
    # through Vercel's Git integration. This hook covers everyone else.
    if: github.event.head_commit.author.username != 'Donovan417'
    steps:
      - name: Trigger Vercel deploy hook
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
